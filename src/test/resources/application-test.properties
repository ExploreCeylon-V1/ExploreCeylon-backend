# ── Integration-test profile: in-memory H2, no external services ──
spring.datasource.url=jdbc:h2:mem:verify;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Return codes in responses so tests can read + submit them (no real email/SMS)
app.dev-mode=true

# Verification rate limiting (mirrors prod defaults)
app.verification.cooldown-seconds=60
app.verification.max-sends-per-hour=5
app.verification.max-attempts=5
app.verification.lock-minutes=30

# JWT (unused by tests but referenced by config beans)
jwt.secret=TestSecretKeyForExploreCeylonIntegrationTestsOnly1234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Neutralise external integrations during context startup
app.base.url=http://localhost:8080
frontend.base.url=http://localhost:5173
ai.service.url=http://localhost:8000

# AWS S3 (unused by tests but referenced by S3Config/S3Service @Value fields --
# real values come from the environment only, never committed)
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
aws.s3.region=us-east-1
aws.s3.bucket-name=test-bucket

# RapidAPI (unused by tests but referenced by HotelApiService's @Value field)
rapidapi.key=test-rapidapi-key
