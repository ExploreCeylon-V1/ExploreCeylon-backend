rapidapi.vehicle.baseurl=https://local-vehicles-db.p.rapidapi.com
rapidapi.vehicle.host=local-vehicles-db.p.rapidapi.com


# JWT — short-lived access token backed by a longer-lived, revocable DB refresh token
# (see RefreshToken / RefreshTokenService); refresh-expiration also sizes refresh token TTL.
# Secret comes from the environment only — never committed here.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# AI Service
ai.service.url=http://localhost:8000

# When true, verification/OTP codes are returned in API responses for testing
# (no email/SMS provider is configured yet). Set false in production.
app.dev-mode=false

# Verification rate limiting
app.verification.cooldown-seconds=60
app.verification.max-sends-per-hour=5
app.verification.max-attempts=5
app.verification.lock-minutes=30

